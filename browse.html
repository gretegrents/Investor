<title>Stock Browser</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
.container{max-width:1400px;margin:0 auto}
h1{text-align:center;margin-bottom:20px;color:#fff}
.section{background:#2a2a4a;padding:15px;border-radius:8px;margin-bottom:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select{padding:8px 12px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#fff;min-width:180px;font-size:13px}
.btn{padding:8px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px}
.btn-primary{background:#4fc3f7;color:#000}
.btn-primary:hover{background:#81d4fa}
.btn-secondary{background:#444;color:#fff}
.btn-secondary:hover{background:#555}
.btn-small{padding:4px 10px;font-size:12px}
.time-buttons{display:flex;gap:6px;margin-top:10px}
.time-btn{padding:6px 14px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#aaa;cursor:pointer;font-size:13px}
.time-btn.active{background:#4fc3f7;color:#000;border-color:#4fc3f7}
.chart-box{background:#2a2a4a;border-radius:8px;padding:20px;height:500px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:flex;align-items:center;gap:4px;background:#3a3a5a;border:1px solid #555;border-radius:16px;padding:4px 10px;font-size:12px;color:#e0e0e0}
.tag .x{cursor:pointer;color:#ff6b6b;font-weight:bold;margin-left:4px;font-size:14px}
.tag .x:hover{color:#ff0000}
.msg{padding:10px;font-size:13px;white-space:pre-wrap}
.msg-error{color:#ff6b6b}
.msg-info{color:#888}
.company-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.company-btn{padding:4px 10px;border-radius:4px;border:1px solid #555;background:#2a2a4a;color:#e0e0e0;cursor:pointer;font-size:12px}
.company-btn:hover{background:#4fc3f7;color:#000;border-color:#4fc3f7}
.company-btn.selected{background:#4fc3f7;color:#000;border-color:#4fc3f7}
label{font-size:12px;color:#aaa;margin-right:4px}
.nav{text-align:right;margin-bottom:10px}
.nav a{color:#4fc3f7;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="container">
<div class="nav"><a href="stocks.html">← Back to Stock Tool</a></div>

    </select>

    <select id="selSector" onchange="updateIndustries()">

    </select>
    <label>Industry:</label>
    <select id="selIndustry" onchange="updateCompanies()">

    </select>
  </div>
  <div class="row">
  <input type="text" id="viewName" placeholder="View name" style="width:150px">

  <select id="savedViews" onchange="loadView()">

  </select>
  <button class="btn btn-small btn-secondary" onclick="deleteView()">🗑️</button>
</div>
<div class="row">
  <textarea id="viewNotes" placeholder="Add a note (auto-timestamped)..." style="width:100%;height:40px;background:#1a1a2e;border:1px solid #444;color:#e0e0e0;border-radius:4px;padding:6px;font-size:12px;resize:vertical"></textarea>
  <button class="btn btn-small btn-secondary" onclick="addNote()">📝 Add Note</button>
</div>
<div id="notesList" style="font-size:12px;color:#aaa;margin-top:6px"></div>

  </div>
  <div class="company-list" id="companyList"></div>
  <div class="tags" id="chartTags"></div>
  <div class="time-buttons">
    <button class="time-btn" onclick="setTime('1M',this)">1M</button>
    <button class="time-btn" onclick="setTime('3M',this)">3M</button>
    <button class="time-btn active" onclick="setTime('6M',this)">6M</button>
    <button class="time-btn" onclick="setTime('1Y',this)">1Y</button>
    <button class="time-btn" onclick="setTime('3Y',this)">3Y</button>
    <button class="time-btn" onclick="setTime('5Y',this)">5Y</button>

</div>

<div class="chart-box"><canvas id="priceChart"></canvas></div>
<div class="msg msg-error" id="chartMsg"></div>
<div class="msg msg-info">Prices normalized to 100% at start date. Click companies to add/remove from chart.</div>

// === FILTER LOGIC ===
function updateSectors(){
  var ex=document.getElementById('selExchange').value;
  var sel=document.getElementById('selSector');
  sel.innerHTML='<option value="">— Select Sector —</option>';
  document.getElementById('selIndustry').innerHTML='<option value="">— All Industries —</option>';
  document.getElementById('companyList').innerHTML='';
  if(!ex||!DB[ex])return;
  Object.keys(DB[ex]).forEach(function(sector){
    sel.innerHTML+='<option value="'+sector+'">'+sector+'</option>';
  });
}

function updateIndustries(){
  var ex=document.getElementById('selExchange').value;
  var sec=document.getElementById('selSector').value;
  var sel=document.getElementById('selIndustry');
  sel.innerHTML='<option value="">— All Industries —</option>';
  document.getElementById('companyList').innerHTML='';
  if(!ex||!sec||!DB[ex]||!DB[ex][sec])return;
  Object.keys(DB[ex][sec]).forEach(function(ind){
    sel.innerHTML+='<option value="'+ind+'">'+ind+'</option>';
  });
  updateCompanies();
}

function updateCompanies(){
  var ex=document.getElementById('selExchange').value;
  var sec=document.getElementById('selSector').value;
  var ind=document.getElementById('selIndustry').value;
  var list=document.getElementById('companyList');
  list.innerHTML='';
  if(!ex||!sec||!DB[ex]||!DB[ex][sec])return;
  
  var companies=[];
  if(ind&&DB[ex][sec][ind]){
    companies=DB[ex][sec][ind];
  }else{
    Object.keys(DB[ex][sec]).forEach(function(i){
      companies=companies.concat(DB[ex][sec][i]);
    });
  }
  
  companies.forEach(function(c){
    var selected=tickers.indexOf(c.t)!==-1;
    list.innerHTML+='<button class="company-btn'+(selected?' selected':'')+'" onclick="toggleCompany(\''+c.t+'\',\''+c.n+'\')">'+c.t.replace('.OL','').replace('.ST','')+' — '+c.n+'</button>';
  });
}

function toggleCompany(ticker,name){
  var idx=tickers.indexOf(ticker);
  if(idx===-1){
    tickers.push(ticker);
    chartNames[ticker]=name;
  }else{
    tickers.splice(idx,1);
    delete chartNames[ticker];
    delete chartData[ticker];
  }
  renderTags();
  updateCompanies();
}

function addAllFiltered(){
  var btns=document.querySelectorAll('.company-btn');
  btns.forEach(function(btn){
    var text=btn.textContent;
    var ticker=btn.getAttribute('onclick').match(/'([^']+)'/)[1];
    var name=btn.getAttribute('onclick').match(/'([^']+)'/g)[1].replace(/'/g,'');
    if(tickers.indexOf(ticker)===-1){
      tickers.push(ticker);
      chartNames[ticker]=name;
    }
  });
  renderTags();
  updateCompanies();
}

function clearAll(){
  tickers=[];
  chartData={};
  chartNames={};
  renderTags();
  updateCompanies();
  if(chart){chart.destroy();chart=null;}
}

function removeTag(ticker){
  tickers=tickers.filter(function(t){return t!==ticker});
  delete chartData[ticker];
  delete chartNames[ticker];
  renderTags();
  updateCompanies();
  if(Object.keys(chartData).length>0)renderChart();
  else if(chart){chart.destroy();chart=null;}
}

function renderTags(){
  var html='';
  tickers.forEach(function(t){
    var name=chartNames[t]?' — '+chartNames[t]:'';
    html+='<div class="tag">'+t+name+'<span class="x" onclick="removeTag(\''+t+'\')">×</span></div>';
  });
  document.getElementById('chartTags').innerHTML=html;
}

// === TIME ===
function setTime(r,btn){
  timeRange=r;
  document.querySelectorAll('.time-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  if(Object.keys(chartData).length>0)renderChart();
}

// === CHART ===
function fetchChart(){
  if(!tickers.length){document.getElementById('chartMsg').textContent='Select companies first';return}
  document.getElementById('chartMsg').textContent='Loading '+tickers.length+' stocks...';
  chartData={};
  var loaded=0;
  
  var now=Math.floor(Date.now()/1000);
  var start=new Date();
  if(timeRange==='1M')start.setMonth(start.getMonth()-1);
  else if(timeRange==='3M')start.setMonth(start.getMonth()-3);
  else if(timeRange==='6M')start.setMonth(start.getMonth()-6);
  else if(timeRange==='1Y')start.setFullYear(start.getFullYear()-1);
  else if(timeRange==='3Y')start.setFullYear(start.getFullYear()-3);
  else if(timeRange==='5Y')start.setFullYear(start.getFullYear()-5);
  var period1=Math.floor(start.getTime()/1000);
  
  tickers.forEach(function(ticker){
    var url=PROXY+'?symbol='+ticker+'&period1='+period1+'&period2='+now+'&interval=1d';
    fetch(url).then(function(r){return r.json()}).then(function(data){
      if(data.chart&&data.chart.result&&data.chart.result[0]){
        var result=data.chart.result[0];
        var timestamps=result.timestamp;
        var closes=result.indicators.quote[0].close;
        if(!chartNames[ticker])chartNames[ticker]=result.meta.shortName||ticker;
        chartData[ticker]=[];
        for(var i=0;i<timestamps.length;i++){
          if(closes[i]!==null){
            var d=new Date(timestamps[i]*1000);
            chartData[ticker].push({date:d.toISOString().split('T')[0],close:closes[i]});
          }
        }
      }else{
        document.getElementById('chartMsg').textContent+='\n'+ticker+': No data';
      }
      loaded++;
      if(loaded===tickers.length){
        if(Object.keys(chartData).length>0){
          document.getElementById('chartMsg').textContent='';
          renderChart();
        }
      }
    }).catch(function(e){
      document.getElementById('chartMsg').textContent+='\n'+ticker+': '+e.message;
      loaded++;
    });
  });
}

function renderChart(){
  var colors=['#4fc3f7','#ff6b6b','#69f0ae','#ffd54f','#ce93d8','#ff8a65','#80cbc4','#f48fb1','#aed581','#90a4ae'];
  var datasets=[],labels=null;
  
  Object.keys(chartData).forEach(function(ticker,idx){
    var data=chartData[ticker];
    if(!data.length)return;
    var base=data[0].close;
    if(!labels)labels=data.map(function(d){return d.date});
    datasets.push({
      label:(chartNames[ticker]||ticker),
      data:data.map(function(d){return d.close/base}),
      borderColor:colors[idx%colors.length],
      backgroundColor:'transparent',
      borderWidth:2,
      pointRadius:0,
      tension:0.1
    });
  });
  
  if(!labels)return;
  if(chart)chart.destroy();
  
  chart=new Chart(document.getElementById('priceChart'),{
    type:'line',
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'right',labels:{color:'#e0e0e0',usePointStyle:true,font:{size:11}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+(ctx.parsed.y*100).toFixed(1)+'%'}}}
      },
      scales:{
        x:{ticks:{color:'#888',maxTicksLimit:12},grid:{color:'#333'}},
        y:{ticks:{color:'#888',callback:function(v){return(v*100).toFixed(0)+'%'}},grid:{color:'#333'}}
      }
    }
  });
}
</script>
