<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector Performance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
.container{max-width:1400px;margin:0 auto}
h1{text-align:center;margin-bottom:20px;color:#fff}
.section{background:#2a2a4a;padding:15px;border-radius:8px;margin-bottom:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn{padding:8px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px}
.btn-primary{background:#4fc3f7;color:#000}
.btn-primary:hover{background:#81d4fa}
.view-btn{padding:8px 18px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#aaa;cursor:pointer;font-size:13px}
.view-btn.active{background:#4fc3f7;color:#000;border-color:#4fc3f7}
.time-buttons{display:flex;gap:6px}
.time-btn{padding:6px 14px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#aaa;cursor:pointer;font-size:13px}
.time-btn.active{background:#4fc3f7;color:#000;border-color:#4fc3f7}
.chart-box{background:#2a2a4a;border-radius:8px;padding:20px;height:550px}
.msg{padding:10px;font-size:13px;white-space:pre-wrap}
.msg-info{color:#888}
.msg-error{color:#ff6b6b}
.progress{background:#333;border-radius:4px;height:20px;margin-top:10px;overflow:hidden}
.progress-bar{background:#4fc3f7;height:100%;transition:width 0.3s;display:flex;align-items:center;justify-content:center;font-size:11px;color:#000}
.nav{display:flex;gap:15px;margin-bottom:10px}
.nav a{color:#4fc3f7;text-decoration:none;font-size:13px}
select{padding:8px 12px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#fff;font-size:13px}
.filter-tag{padding:4px 10px;border-radius:4px;border:1px solid #555;background:#2a2a4a;color:#e0e0e0;cursor:pointer;font-size:12px}
.filter-tag:hover{border-color:#4fc3f7}
.filter-tag.hidden{opacity:0.4;text-decoration:line-through}
</style>
</head>
<body>
<div class="container">
<div class="nav">
  <a href="stocks.html">📈 Stock Tool</a>
  <a href="browse.html">🔍 Browse</a>
</div>
<h1>Sector & Industry Performance</h1>

<div class="section">
  <div class="row">
    <select id="selExchange">
      <option value="OSL">🇳🇴 Oslo Børs</option>
      <option value="STO">🇸🇪 Stockholm</option>
    </select>
    <span id="status" style="color:#888;font-size:12px"></span>
  </div>
  <div class="row">
    <span style="color:#aaa;font-size:12px">View:</span>
    <button class="view-btn active" id="vBtn-sectors" onclick="setView('sectors')">🏢 Sectors</button>
    <button class="view-btn" id="vBtn-industries" onclick="setView('industries')">🏭 Industries</button>
  </div>
  <div class="time-buttons">
    <button class="time-btn" onclick="setTime('1M',this)">1M</button>
    <button class="time-btn" onclick="setTime('3M',this)">3M</button>
    <button class="time-btn active" onclick="setTime('6M',this)">6M</button>
    <button class="time-btn" onclick="setTime('1Y',this)">1Y</button>
    <button class="time-btn" onclick="setTime('3Y',this)">3Y</button>
    <button class="time-btn" onclick="setTime('5Y',this)">5Y</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn btn-primary" onclick="loadAllData()">⬇️ Load All Data</button>
  </div>
  <div class="progress" id="progressBox" style="display:none">
    <div class="progress-bar" id="progressBar" style="width:0%">0%</div>
  </div>
  <div id="filterTags" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px"></div>
</div>

<div class="chart-box"><canvas id="sectorChart"></canvas></div>
<div class="msg msg-error" id="chartMsg"></div>
<div class="msg msg-info">Click sectors/industries to show/hide them. Load data first (~30s).</div>
</div>

<script>
var PROXY='https://yahoo.gretegrents.workers.dev/';
var chart=null,timeRange='6M',viewMode='sectors';
var allStockData={};
var isLoading=false;
var hiddenGroups={};

var DB={
"OSL":{
"Energy":{"Oil & Gas":[{t:"EQNR.OL"},{t:"AKRBP.OL"},{t:"VAR.OL"},{t:"DNO.OL"},{t:"BNOR.OL"},{t:"BWE.OL"}],"Renewables":[{t:"SCATC.OL"},{t:"BONHR.OL"}]},
"Shipping":{"Tankers":[{t:"FRO.OL"},{t:"HAFNI.OL"},{t:"OET.OL"},{t:"BWLPG.OL"},{t:"ODF.OL"}],"Offshore":[{t:"SUBC.OL"},{t:"AKSO.OL"},{t:"DOFG.OL"},{t:"BORR.OL"},{t:"ODL.OL"}],"Car Carriers":[{t:"WAWI.OL"},{t:"HAUTO.OL"}],"Container":[{t:"MPCC.OL"},{t:"KCC.OL"},{t:"HSHP.OL"}]},
"Seafood":{"Salmon":[{t:"MOWI.OL"},{t:"SALM.OL"},{t:"LSG.OL"},{t:"BAKKA.OL"},{t:"AUSS.OL"}]},
"Finance":{"Banks":[{t:"DNB.OL"},{t:"SB1NO.OL"},{t:"SBNOR.OL"},{t:"MING.OL"},{t:"NONG.OL"}],"Insurance":[{t:"GJF.OL"},{t:"STB.OL"},{t:"PROT.OL"}]},
"Technology":{"Semiconductors":[{t:"NOD.OL"}],"Software":[{t:"PEXIP.OL"},{t:"AUTO.OL"},{t:"ATEA.OL"},{t:"LINK.OL"}],"Electronics":[{t:"KIT.OL"},{t:"NORBT.OL"}]},
"Industrials":{"Defense":[{t:"KOG.OL"},{t:"KMAR.OL"}],"Materials":[{t:"NHY.OL"},{t:"YAR.OL"},{t:"ELK.OL"},{t:"BRG.OL"}],"Construction":[{t:"VEI.OL"},{t:"AFG.OL"}],"Recycling":[{t:"TOM.OL"}]},
"Consumer":{"Retail":[{t:"ORK.OL"},{t:"EPRE.OL"}],"Fitness":[{t:"SATS.OL"}],"Packaging":[{t:"ELO.OL"}]},
"Telecom":{"Telecom":[{t:"TEL.OL"}],"Media":[{t:"VEND.OL"}]},
"Real Estate":{"Commercial":[{t:"ENTRA.OL"},{t:"PUBLI.OL"}]}
},
"STO":{
"Technology":{"Software":[{t:"ERIC-B.ST"},{t:"SINCH.ST"},{t:"HEXAB.ST"}]},
"Finance":{"Banks":[{t:"SEB-A.ST"},{t:"SWED-A.ST"},{t:"SHB-A.ST"},{t:"NDA-SE.ST"}]},
"Industrials":{"Engineering":[{t:"VOLV-B.ST"},{t:"SAND.ST"},{t:"ATCO-A.ST"},{t:"ALFA.ST"}],"Defense":[{t:"SAAB-B.ST"}]},
"Consumer":{"Fashion":[{t:"HM-B.ST"}]},
"Healthcare":{"Pharma":[{t:"AZN.ST"}]}
}
};

function getAllTickers(exchange){
  var tickers=[];
  var db=DB[exchange];
  if(!db)return tickers;
  Object.keys(db).forEach(function(sector){
    Object.keys(db[sector]).forEach(function(industry){
      db[sector][industry].forEach(function(s){tickers.push(s.t)});
    });
  });
  return tickers;
}

function getTickerMapping(exchange){
  var map={};
  var db=DB[exchange];
  Object.keys(db).forEach(function(sector){
    Object.keys(db[sector]).forEach(function(industry){
      db[sector][industry].forEach(function(s){
        map[s.t]={sector:sector,industry:industry};
      });
    });
  });
  return map;
}

async function loadAllData(){
  if(isLoading)return;
  isLoading=true;
  var exchange=document.getElementById('selExchange').value;
  var tickers=getAllTickers(exchange);
  var total=tickers.length;
  
  document.getElementById('progressBox').style.display='block';
  document.getElementById('status').textContent='Loading '+total+' stocks...';
  document.getElementById('chartMsg').textContent='';
  allStockData={};
  
  var now=Math.floor(Date.now()/1000);
  var start=new Date();
  start.setFullYear(start.getFullYear()-5);
  var period1=Math.floor(start.getTime()/1000);
  
  var loaded=0;
  var batchSize=5;
  
  for(var i=0;i<tickers.length;i+=batchSize){
    var batch=tickers.slice(i,i+batchSize);
    var promises=batch.map(function(ticker){
      var url=PROXY+'?symbol='+ticker+'&period1='+period1+'&period2='+now+'&interval=1d';
      return fetch(url).then(function(r){return r.json()}).then(function(data){
        if(data.chart&&data.chart.result&&data.chart.result[0]){
          var result=data.chart.result[0];
          var timestamps=result.timestamp||[];
          var closes=result.indicators.quote[0].close||[];
          allStockData[ticker]=[];
          for(var j=0;j<timestamps.length;j++){
            if(closes[j]!==null){
              allStockData[ticker].push({date:new Date(timestamps[j]*1000).toISOString().split('T')[0],close:closes[j]});
            }
          }
        }
        loaded++;
        var pct=Math.round(loaded/total*100);
        document.getElementById('progressBar').style.width=pct+'%';
        document.getElementById('progressBar').textContent=pct+'% ('+loaded+'/'+total+')';
      }).catch(function(){loaded++;});
    });
    await Promise.all(promises);
    await new Promise(function(r){setTimeout(r,300)});
  }
  
  document.getElementById('status').textContent='Loaded '+loaded+'/'+total+' stocks ✓';
  document.getElementById('progressBox').style.display='none';
  isLoading=false;
  hiddenGroups={};
  renderFilterTags();
  renderSectorChart();
}

function setView(mode){
  viewMode=mode;
  document.querySelectorAll('.view-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('vBtn-'+mode).classList.add('active');
  hiddenGroups={};
  renderFilterTags();
  if(Object.keys(allStockData).length>0)renderSectorChart();
}

function setTime(r,btn){
  timeRange=r;
  document.querySelectorAll('.time-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  if(Object.keys(allStockData).length>0)renderSectorChart();
}

function getStartDate(){
  var d=new Date();
  if(timeRange==='1M')d.setMonth(d.getMonth()-1);
  else if(timeRange==='3M')d.setMonth(d.getMonth()-3);
  else if(timeRange==='6M')d.setMonth(d.getMonth()-6);
  else if(timeRange==='1Y')d.setFullYear(d.getFullYear()-1);
  else if(timeRange==='3Y')d.setFullYear(d.getFullYear()-3);
  else if(timeRange==='5Y')d.setFullYear(d.getFullYear()-5);
  return d.toISOString().split('T')[0];
}

function renderFilterTags(){
  var exchange=document.getElementById('selExchange').value;
  var db=DB[exchange];
  if(!db){document.getElementById('filterTags').innerHTML='';return;}
  var groups=[];
  if(viewMode==='sectors'){
    groups=Object.keys(db);
  }else{
    Object.keys(db).forEach(function(sector){
      Object.keys(db[sector]).forEach(function(ind){
        if(groups.indexOf(ind)===-1)groups.push(ind);
      });
    });
  }
  var html='';
  groups.sort().forEach(function(g){
    var cls=hiddenGroups[g]?'filter-tag hidden':'filter-tag';
    html+='<button class="'+cls+'" onclick="toggleGroup(\''+g+'\')">'+g+'</button>';
  });
  document.getElementById('filterTags').innerHTML=html;
}

function toggleGroup(group){
  if(hiddenGroups[group])delete hiddenGroups[group];
  else hiddenGroups[group]=true;
  renderFilterTags();
  if(Object.keys(allStockData).length>0)renderSectorChart();
}

function renderSectorChart(){
  var exchange=document.getElementById('selExchange').value;
  var mapping=getTickerMapping(exchange);
  var startDate=getStartDate();
  var groups={};
  
  Object.keys(allStockData).forEach(function(ticker){
    if(!mapping[ticker])return;
    var groupKey=viewMode==='sectors'?mapping[ticker].sector:mapping[ticker].industry;
    if(hiddenGroups[groupKey])return;
    if(!groups[groupKey])groups[groupKey]=[];
    
    var data=allStockData[ticker].filter(function(d){return d.date>=startDate});
    if(data.length<2)return;
    var base=data[0].close;
    var normalized=data.map(function(d){return{date:d.date,val:d.close/base}});
    groups[groupKey].push(normalized);
  });
  
  var colors=['#4fc3f7','#ff6b6b','#69f0ae','#ffd54f','#ce93d8','#ff8a65','#80cbc4','#f48fb1','#aed581','#90a4ae','#fff176','#a1887f','#b39ddb','#ef9a9a','#80deea'];
  var datasets=[],labels=null;
  var idx=0;
  
  Object.keys(groups).sort().forEach(function(group){
    var stocksInGroup=groups[group];
    if(!stocksInGroup.length)return;
    
    var maxLen=0;
    stocksInGroup.forEach(function(s){if(s.length>maxLen)maxLen=s.length});
    if(!labels)labels=stocksInGroup.reduce(function(a,b){return a.length>b.length?a:b}).map(function(d){return d.date});
    
    var avgData=[];
    for(var i=0;i<maxLen;i++){
      var sum=0,count=0;
      stocksInGroup.forEach(function(s){
        if(i<s.length){sum+=s[i].val;count++;}
      });
      avgData.push(count>0?sum/count:null);
    }
    
    datasets.push({
      label:group+' ('+stocksInGroup.length+')',
      data:avgData,
      borderColor:colors[idx%colors.length],
      backgroundColor:'transparent',
      borderWidth:2.5,
      pointRadius:0,
      tension:0.2
    });
    idx++;
  });
  
  if(!labels||!datasets.length){
    document.getElementById('chartMsg').textContent='No data to display. Load data first.';
    return;
  }
  document.getElementById('chartMsg').textContent='';
  
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('sectorChart'),{
    type:'line',
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'right',labels:{color:'#e0e0e0',usePointStyle:true,font:{size:12}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+(ctx.parsed.y*100).toFixed(1)+'%'}}}
      },
      scales:{
        x:{ticks:{color:'#888',maxTicksLimit:12},grid:{color:'#333'}},
        y:{ticks:{color:'#888',callback:function(v){return(v*100).toFixed(0)+'%'}},grid:{color:'#333'}}
      }
    }
  });
}
</script>
</body>
</html>
