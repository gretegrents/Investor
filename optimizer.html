<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Optimizer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
.container{max-width:1400px;margin:0 auto}
h1{text-align:center;margin-bottom:20px;color:#fff}
h3{color:#4fc3f7;margin-bottom:10px;font-size:14px}
.section{background:#2a2a4a;padding:15px;border-radius:8px;margin-bottom:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=text],input[type=number]{padding:8px 12px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#fff;width:200px;font-size:13px}
input[type=number]{width:80px}
select{padding:8px 12px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#fff;font-size:13px}
.btn{padding:8px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px}
.btn-primary{background:#4fc3f7;color:#000}
.btn-primary:hover{background:#81d4fa}
.btn-secondary{background:#444;color:#fff}
.btn-secondary:hover{background:#555}
.btn-small{padding:4px 10px;font-size:12px}
.chart-box{background:#2a2a4a;border-radius:8px;padding:20px;height:500px;cursor:crosshair}
.msg{padding:10px;font-size:13px;white-space:pre-wrap}
.msg-error{color:#ff6b6b}
.msg-info{color:#888}
.nav{display:flex;gap:15px;margin-bottom:10px}
.nav a{color:#4fc3f7;text-decoration:none;font-size:13px}
label{font-size:12px;color:#aaa;margin-right:4px}
table{width:100%;border-collapse:collapse;background:#2a2a4a;border-radius:8px;overflow:hidden;margin-top:10px}
th,td{padding:8px 12px;text-align:center;border-bottom:1px solid #333;font-size:12px}
th{background:#333;color:#aaa;font-weight:500}
td{color:#e0e0e0}
.positive{color:#69f0ae}
.negative{color:#ff6b6b}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}
.result-card{background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:15px}
.result-card h4{color:#4fc3f7;margin-bottom:8px;font-size:13px}
.weight-bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.weight-bar-fill{height:16px;border-radius:3px;min-width:2px}
.weight-bar-label{font-size:11px;color:#aaa;min-width:140px}
.weight-bar-value{font-size:11px;color:#fff;min-width:40px}
.progress{background:#333;border-radius:4px;height:20px;margin-top:10px;overflow:hidden;display:none}
.progress-bar{background:#4fc3f7;height:100%;transition:width 0.3s;display:flex;align-items:center;justify-content:center;font-size:11px;color:#000}
.notes-section{background:#2a2a4a;padding:15px;border-radius:8px;margin-top:20px}
.notes-section textarea{width:100%;height:60px;background:#1a1a2e;border:1px solid #444;color:#e0e0e0;border-radius:4px;padding:8px;font-size:12px;resize:vertical}
.note-item{border-bottom:1px solid #333;padding:8px 0;font-size:12px}
.note-item .note-time{color:#4fc3f7;font-size:11px}
.note-item .note-text{color:#e0e0e0;margin-top:2px}
.note-item .note-delete{color:#ff6b6b;cursor:pointer;float:right;font-size:11px}
.asset-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#1a1a2e;border:1px solid #333;border-radius:6px;margin:4px 0}
.asset-row .ticker-name{font-size:12px;color:#e0e0e0;flex:1}
.asset-row select{padding:4px 8px;font-size:11px;min-width:80px}
.asset-row .remove-btn{color:#ff6b6b;cursor:pointer;font-size:14px;font-weight:bold}
.equity-tag{color:#69f0ae;font-size:10px;font-weight:bold}
.bond-tag{color:#ffd54f;font-size:10px;font-weight:bold}
.alloc-bar{display:flex;height:24px;border-radius:4px;overflow:hidden;margin:8px 0}
.alloc-bar .eq-part{background:#1b5e20;display:flex;align-items:center;justify-content:center;font-size:11px;color:#69f0ae}
.alloc-bar .bd-part{background:#4a3800;display:flex;align-items:center;justify-content:center;font-size:11px;color:#ffd54f}
</style>
</head>
<body>
<div class="container">
<div class="nav">
  <a href="stocks.html">📈 Stocks</a>
  <a href="funds.html">📊 Funds</a>
  <a href="countries.html">🌍 Countries</a>
  <a href="sectors.html">🏭 Sectors</a>
  <a href="index.html">🏦 Bonds Calc</a>
</div>
<h1>⚡ Portfolio Optimizer</h1>
<div class="section">
  <div class="row">
    <label>Add asset:</label>
    <input type="text" id="tickerInput" placeholder="Ticker (e.g. VOO, AGG)" onkeydown="if(event.key==='Enter')addTicker()">
    <select id="assetClass"><option value="equity">📈 Equity</option><option value="bond">📊 Bond</option></select>
    <button class="btn btn-small btn-primary" onclick="addTicker()">Add</button>
    <button class="btn btn-secondary" onclick="clearAll()">Clear All</button>
  </div>
  <div id="assetList"></div>
  <div class="row" style="margin-top:12px;border-top:1px solid #333;padding-top:12px">
    <label>Bond Allocation:</label>
    <input type="range" id="bondSlider" min="0" max="100" value="40" style="width:200px" oninput="updateSlider()">
    <span id="bondPct" style="color:#ffd54f;font-weight:bold">40%</span>
    <span style="font-size:11px;color:#888">(Equity: <span id="eqPct" style="color:#69f0ae">60%</span>)</span>
  </div>
  <div class="alloc-bar" id="allocBar"><div class="eq-part" style="width:60%">Equity 60%</div><div class="bd-part" style="width:40%">Bond 40%</div></div>
  <div class="row">
    <label>Period:</label>
    <select id="dataPeriod"><option value="3">3yr</option><option value="5" selected>5yr</option><option value="10">10yr</option></select>
    <label>Sims:</label>
    <input type="number" id="numSims" value="10000" min="1000" max="50000" step="1000">
    <label>Rf%:</label>
    <input type="number" id="riskFree" value="4.0" min="0" max="10" step="0.5" style="width:60px">
    <button class="btn btn-primary" onclick="runOptimizer()">🚀 Optimize</button>
  </div>
  <div class="progress" id="progressBox"><div class="progress-bar" id="progressBar" style="width:0%">0%</div></div>
</div>
<div class="chart-box"><canvas id="frontierChart"></canvas></div>
<div class="msg msg-error" id="chartMsg"></div>
<div id="selectedPortfolio"></div>
<div id="results"></div>
<div class="notes-section">
  <h3>📝 Notes</h3>
  <div class="row"><textarea id="noteInput" placeholder="Add a note..."></textarea></div>
  <div class="row"><button class="btn btn-small btn-secondary" onclick="addNote()">Add Note</button></div>
  <div id="notesList"></div>
</div>
<div class="msg msg-info" style="margin-top:10px">Strategic allocation: set bond/equity split, Monte Carlo optimizes within each group. Click dots to explore.</div>
</div>
<script>
var PROXY='https://yahoo.gretegrents.workers.dev/';
var chart=null,assets=[],priceData={},allPortfolios=[],validTickersGlobal=[],tickerNames={},sampleStep=1;

function addTicker(){var input=document.getElementById('tickerInput');var val=input.value.trim().toUpperCase();var cls=document.getElementById('assetClass').value;if(val&&!assets.find(function(a){return a.ticker===val})){assets.push({ticker:val,class:cls});renderAssetList();}input.value='';input.focus();}
function removeAsset(t){assets=assets.filter(function(a){return a.ticker!==t});renderAssetList();}
function changeClass(t,c){var a=assets.find(function(x){return x.ticker===t});if(a)a.class=c;renderAssetList();}
function clearAll(){assets=[];renderAssetList();if(chart){chart.destroy();chart=null;}document.getElementById('results').innerHTML='';document.getElementById('chartMsg').textContent='';document.getElementById('selectedPortfolio').innerHTML='';}
function renderAssetList(){var html='';assets.forEach(function(a){var name=tickerNames[a.ticker]?' — '+tickerNames[a.ticker]:'';var tag=a.class==='equity'?'<span class="equity-tag">EQ</span>':'<span class="bond-tag">BOND</span>';html+='<div class="asset-row">'+tag+'<span class="ticker-name">'+a.ticker+name+'</span><select onchange="changeClass(\''+a.ticker+'\',this.value)"><option value="equity"'+(a.class==='equity'?' selected':'')+'>📈 Equity</option><option value="bond"'+(a.class==='bond'?' selected':'')+'>📊 Bond</option></select><span class="remove-btn" onclick="removeAsset(\''+a.ticker+'\')">×</span></div>';});document.getElementById('assetList').innerHTML=html;}
function updateSlider(){var v=document.getElementById('bondSlider').value;document.getElementById('bondPct').textContent=v+'%';document.getElementById('eqPct').textContent=(100-v)+'%';document.getElementById('allocBar').innerHTML='<div class="eq-part" style="width:'+(100-v)+'%">Equity '+(100-v)+'%</div><div class="bd-part" style="width:'+v+'%">Bond '+v+'%</div>';}
function getLabel(t){return tickerNames[t]?t+' — '+tickerNames[t]:t;}
async function runOptimizer(){
  var eqAssets=assets.filter(function(a){return a.class==='equity'});
  var bdAssets=assets.filter(function(a){return a.class==='bond'});
  if(assets.length<2){document.getElementById('chartMsg').textContent='Add at least 2 assets';return;}
  var bondAlloc=parseInt(document.getElementById('bondSlider').value)/100;
  var eqAlloc=1-bondAlloc;
  if(bondAlloc>0&&bdAssets.length===0){document.getElementById('chartMsg').textContent='Add bond assets or set bond allocation to 0%';return;}
  if(eqAlloc>0&&eqAssets.length===0){document.getElementById('chartMsg').textContent='Add equity assets or set bond allocation to 100%';return;}
  var years=parseInt(document.getElementById('dataPeriod').value);
  var numSims=parseInt(document.getElementById('numSims').value);
  var rf=parseFloat(document.getElementById('riskFree').value)/100;
  document.getElementById('chartMsg').textContent='Fetching data...';
  document.getElementById('progressBox').style.display='block';
  document.getElementById('progressBar').style.width='0%';
  document.getElementById('results').innerHTML='';
  document.getElementById('selectedPortfolio').innerHTML='';
  priceData={};tickerNames={};
  var now=Math.floor(Date.now()/1000);var start=new Date();start.setFullYear(start.getFullYear()-years);
  var period1=Math.floor(start.getTime()/1000);var allT=assets.map(function(a){return a.ticker});var loaded=0;var failed=[];
  for(var i=0;i<allT.length;i++){var ticker=allT[i];try{var url=PROXY+'?symbol='+encodeURIComponent(ticker)+'&period1='+period1+'&period2='+now+'&interval=1wk';var resp=await fetch(url);var data=await resp.json();if(data.chart&&data.chart.result&&data.chart.result[0]){var res=data.chart.result[0];var ts=res.timestamp||[];var cl=res.indicators.quote[0].close||[];var pr=[];for(var j=0;j<ts.length;j++){if(cl[j]!==null)pr.push(cl[j]);}if(pr.length>10){priceData[ticker]=pr;tickerNames[ticker]=res.meta.shortName||res.meta.longName||ticker;}else failed.push(ticker);}else failed.push(ticker);}catch(e){failed.push(ticker);}loaded++;document.getElementById('progressBar').style.width=Math.round(loaded/allT.length*30)+'%';}
  renderAssetList();
  if(failed.length>0){document.getElementById('chartMsg').textContent='Failed: '+failed.join(', ');document.getElementById('progressBox').style.display='none';return;}
  var validT=Object.keys(priceData);var vEq=eqAssets.map(function(a){return a.ticker}).filter(function(t){return priceData[t]});var vBd=bdAssets.map(function(a){return a.ticker}).filter(function(t){return priceData[t]});
  var returns={};var minLen=Infinity;
  validT.forEach(function(t){var p=priceData[t];var r=[];for(var i=1;i<p.length;i++)r.push((p[i]-p[i-1])/p[i-1]);returns[t]=r;if(r.length<minLen)minLen=r.length;});
  validT.forEach(function(t){returns[t]=returns[t].slice(returns[t].length-minLen);});
  var meanR={};validT.forEach(function(t){var s=0;returns[t].forEach(function(r){s+=r});meanR[t]=(s/returns[t].length)*52;});
  var n=validT.length;var cov=[];
  for(var i=0;i<n;i++){cov[i]=[];for(var j=0;j<n;j++){var s=0;var mi=meanR[validT[i]]/52;var mj=meanR[validT[j]]/52;for(var k=0;k<minLen;k++)s+=(returns[validT[i]][k]-mi)*(returns[validT[j]][k]-mj);cov[i][j]=(s/(minLen-1))*52;}}
  document.getElementById('chartMsg').textContent='Running Monte Carlo...';
  var portfolios=[];var maxS={sharpe:-Infinity};var minV={vol:Infinity};
  for(var sim=0;sim<numSims;sim++){
    var wEq=[],wBd=[],sE=0,sB=0;
    for(var i=0;i<vEq.length;i++){wEq[i]=Math.random();sE+=wEq[i];}
    for(var i=0;i<vEq.length;i++)wEq[i]/=sE;
    for(var i=0;i<vBd.length;i++){wBd[i]=Math.random();sB+=wBd[i];}
    for(var i=0;i<vBd.length;i++)wBd[i]/=sB;
    var allW=[];
    for(var i=0;i<n;i++){var w=0;var ei=vEq.indexOf(validT[i]);var bi=vBd.indexOf(validT[i]);if(ei>=0)w+=wEq[ei]*eqAlloc;if(bi>=0)w+=wBd[bi]*bondAlloc;allW.push(w);}
    var pRet=0;for(var i=0;i<n;i++)pRet+=allW[i]*meanR[validT[i]];
    var pVar=0;for(var i=0;i<n;i++)for(var j=0;j<n;j++)pVar+=allW[i]*allW[j]*cov[i][j];
    var pVol=Math.sqrt(pVar);var sh=(pRet-rf)/pVol;
    var p={ret:pRet,vol:pVol,sharpe:sh,weights:allW};
    portfolios.push(p);
    if(sh>maxS.sharpe)maxS=p;
    if(pVol<minV.vol)minV=p;
    if(sim%2000===0)document.getElementById('progressBar').style.width=(30+Math.round(sim/numSims*60))+'%';
  }
  allPortfolios=portfolios;validTickersGlobal=validT;
  document.getElementById('progressBar').style.width='95%';
  await new Promise(function(r){setTimeout(r,50)});
  plotFrontier(portfolios,maxS,minV,validT,meanR,cov,rf);
  showResults(validT,meanR,cov,maxS,minV,rf);
  document.getElementById('progressBox').style.display='none';
  document.getElementById('chartMsg').textContent='';
}

function plotFrontier(portfolios,maxS,minV,validT,meanR,cov,rf){
  if(chart)chart.destroy();
  sampleStep=Math.max(1,Math.floor(portfolios.length/3000));
  var sd=[];for(var i=0;i<portfolios.length;i+=sampleStep)sd.push({x:portfolios[i].vol*100,y:portfolios[i].ret*100});
  var ap=[];for(var i=0;i<validT.length;i++)ap.push({x:Math.sqrt(cov[i][i])*100,y:meanR[validT[i]]*100});
  chart=new Chart(document.getElementById('frontierChart'),{type:'scatter',data:{datasets:[
    {label:'Portfolios',data:sd,backgroundColor:'rgba(79,195,247,0.15)',borderColor:'rgba(79,195,247,0.3)',pointRadius:1.5,pointHoverRadius:5},
    {label:'Max Sharpe ('+maxS.sharpe.toFixed(2)+')',data:[{x:maxS.vol*100,y:maxS.ret*100}],backgroundColor:'#69f0ae',borderColor:'#69f0ae',pointRadius:10,pointStyle:'star'},
    {label:'Min Vol',data:[{x:minV.vol*100,y:minV.ret*100}],backgroundColor:'#ffd54f',borderColor:'#ffd54f',pointRadius:10,pointStyle:'triangle'},
    {label:'Assets',data:ap,backgroundColor:'#ff6b6b',borderColor:'#ff6b6b',pointRadius:7,pointStyle:'circle'}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{color:'#e0e0e0',usePointStyle:true,font:{size:11}}},tooltip:{callbacks:{label:function(ctx){if(ctx.datasetIndex===3)return getLabel(validTickersGlobal[ctx.dataIndex])+': '+ctx.parsed.y.toFixed(1)+'%r, '+ctx.parsed.x.toFixed(1)+'%v';return ctx.parsed.y.toFixed(1)+'% ret, '+ctx.parsed.x.toFixed(1)+'% risk (click)';}}}},scales:{x:{title:{display:true,text:'Risk %',color:'#aaa'},ticks:{color:'#888'},grid:{color:'#333'}},y:{title:{display:true,text:'Return %',color:'#aaa'},ticks:{color:'#888'},grid:{color:'#333'}}}}});
  document.getElementById('frontierChart').onclick=function(evt){var pts=chart.getElementsAtEventForMode(evt,'nearest',{intersect:true},true);if(pts.length>0&&pts[0].datasetIndex===0){var idx=pts[0].index*sampleStep;if(idx<allPortfolios.length)showSelected(allPortfolios[idx]);}};
}

function showSelected(p){
  var colors=['#4fc3f7','#ff6b6b','#69f0ae','#ffd54f','#ce93d8','#ff8a65','#80cbc4','#f48fb1','#aed581','#90a4ae'];
  var html='<div class="result-card" style="margin-top:15px"><h4>📍 Selected Portfolio</h4>';
  html+='<div style="margin-bottom:8px"><span style="color:#69f0ae">Return: '+(p.ret*100).toFixed(1)+'%</span> | <span style="color:#ffd54f">Risk: '+(p.vol*100).toFixed(1)+'%</span> | <span style="color:#4fc3f7">Sharpe: '+p.sharpe.toFixed(2)+'</span></div>';
  var sorted=[];for(var i=0;i<validTickersGlobal.length;i++){var a=assets.find(function(x){return x.ticker===validTickersGlobal[i]});sorted.push({ticker:validTickersGlobal[i],weight:p.weights[i],color:colors[i%colors.length],cls:a?a.class:'equity'});}
  sorted.sort(function(a,b){return b.weight-a.weight});
  sorted.forEach(function(s){var w=s.weight*100;if(w<0.5)return;var tag=s.cls==='bond'?'<span class="bond-tag">BOND</span> ':'<span class="equity-tag">EQ</span> ';html+='<div class="weight-bar"><span class="weight-bar-label">'+tag+getLabel(s.ticker)+'</span><div class="weight-bar-fill" style="width:'+Math.min(w,100)*2+'px;background:'+s.color+'"></div><span class="weight-bar-value">'+w.toFixed(1)+'%</span></div>';});
  html+='</div>';document.getElementById('selectedPortfolio').innerHTML=html;
}

function showResults(validT,meanR,cov,maxS,minV,rf){
  var colors=['#4fc3f7','#ff6b6b','#69f0ae','#ffd54f','#ce93d8','#ff8a65','#80cbc4','#f48fb1','#aed581','#90a4ae'];
  var html='<div class="results-grid">';
  html+='<div class="result-card"><h4>⭐ Max Sharpe Portfolio</h4><div style="margin-bottom:8px"><span style="color:#69f0ae">Ret: '+(maxS.ret*100).toFixed(1)+'%</span> | <span style="color:#ffd54f">Risk: '+(maxS.vol*100).toFixed(1)+'%</span> | <span style="color:#4fc3f7">Sharpe: '+maxS.sharpe.toFixed(2)+'</span></div>';
  for(var i=0;i<validT.length;i++){var w=maxS.weights[i]*100;if(w<0.5)continue;var a=assets.find(function(x){return x.ticker===validT[i]});var tag=a&&a.class==='bond'?'<span class="bond-tag">BD</span> ':'<span class="equity-tag">EQ</span> ';html+='<div class="weight-bar"><span class="weight-bar-label">'+tag+getLabel(validT[i])+'</span><div class="weight-bar-fill" style="width:'+Math.min(w,100)*2+'px;background:'+colors[i%colors.length]+'"></div><span class="weight-bar-value">'+w.toFixed(1)+'%</span></div>';}
  html+='</div>';
  html+='<div class="result-card"><h4>🛡️ Min Volatility Portfolio</h4><div style="margin-bottom:8px"><span style="color:#69f0ae">Ret: '+(minV.ret*100).toFixed(1)+'%</span> | <span style="color:#ffd54f">Risk: '+(minV.vol*100).toFixed(1)+'%</span> | <span style="color:#4fc3f7">Sharpe: '+minV.sharpe.toFixed(2)+'</span></div>';
  for(var i=0;i<validT.length;i++){var w=minV.weights[i]*100;if(w<0.5)continue;var a=assets.find(function(x){return x.ticker===validT[i]});var tag=a&&a.class==='bond'?'<span class="bond-tag">BD</span> ':'<span class="equity-tag">EQ</span> ';html+='<div class="weight-bar"><span class="weight-bar-label">'+tag+getLabel(validT[i])+'</span><div class="weight-bar-fill" style="width:'+Math.min(w,100)*2+'px;background:'+colors[i%colors.length]+'"></div><span class="weight-bar-value">'+w.toFixed(1)+'%</span></div>';}
  html+='</div></div>';
  html+='<div class="section" style="margin-top:15px"><h3>Asset Statistics</h3><table><tr><th style="text-align:left">Asset</th><th>Class</th><th>Return</th><th>Volatility</th><th>Sharpe</th></tr>';
  for(var i=0;i<validT.length;i++){var ret=meanR[validT[i]]*100;var vol=Math.sqrt(cov[i][i])*100;var sh=(meanR[validT[i]]-rf)/Math.sqrt(cov[i][i]);var a=assets.find(function(x){return x.ticker===validT[i]});var cls=a?a.class:'?';html+='<tr><td style="text-align:left">'+getLabel(validT[i])+'</td><td>'+(cls==='bond'?'📊 Bond':'📈 Equity')+'</td><td class="'+(ret>=0?'positive':'negative')+'">'+ret.toFixed(1)+'%</td><td>'+vol.toFixed(1)+'%</td><td>'+sh.toFixed(2)+'</td></tr>';}
  html+='</table></div>';
  html+='<div class="section"><h3>Correlation Matrix</h3><table><tr><th></th>';
  validT.forEach(function(t){html+='<th title="'+getLabel(t)+'">'+t+'</th>';});html+='</tr>';
  for(var i=0;i<validT.length;i++){html+='<tr><td style="font-weight:bold" title="'+getLabel(validT[i])+'">'+validT[i]+'</td>';for(var j=0;j<validT.length;j++){var corr=cov[i][j]/(Math.sqrt(cov[i][i])*Math.sqrt(cov[j][j]));var color=corr>0.7?'#ff6b6b':corr<0.3?'#69f0ae':'#e0e0e0';html+='<td style="color:'+color+'">'+corr.toFixed(2)+'</td>';}html+='</tr>';}
  html+='</table><div style="font-size:11px;color:#888;margin-top:5px">🟢 Low corr (diversified) | 🔴 High corr (redundant)</div></div>';
  document.getElementById('results').innerHTML=html;
}

function addNote(){var text=document.getElementById('noteInput').value.trim();if(!text)return;var notes=JSON.parse(localStorage.getItem('optimizerNotes')||'[]');notes.unshift({time:new Date().toLocaleString(),text:text,tickers:assets.map(function(a){return a.ticker})});localStorage.setItem('optimizerNotes',JSON.stringify(notes));document.getElementById('noteInput').value='';renderNotes();}
function deleteNote(i){var notes=JSON.parse(localStorage.getItem('optimizerNotes')||'[]');notes.splice(i,1);localStorage.setItem('optimizerNotes',JSON.stringify(notes));renderNotes();}
function renderNotes(){var notes=JSON.parse(localStorage.getItem('optimizerNotes')||'[]');var html='';notes.forEach(function(n,i){html+='<div class="note-item"><span class="note-delete" onclick="deleteNote('+i+')">✕</span><div class="note-time">'+n.time+(n.tickers?' — ['+n.tickers.join(', ')+']':'')+'</div><div class="note-text">'+n.text+'</div></div>';});document.getElementById('notesList').innerHTML=html;}
renderNotes();
</script>
</body>
</html>
