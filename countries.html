<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Market Performance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
.container{max-width:1400px;margin:0 auto}
h1{text-align:center;margin-bottom:20px;color:#fff}
.section{background:#2a2a4a;padding:15px;border-radius:8px;margin-bottom:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn{padding:8px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px}
.btn-primary{background:#4fc3f7;color:#000}
.btn-primary:hover{background:#81d4fa}
.btn-secondary{background:#444;color:#fff}
.btn-secondary:hover{background:#555}
.view-btn{padding:8px 18px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#aaa;cursor:pointer;font-size:13px}
.view-btn.active{background:#4fc3f7;color:#000;border-color:#4fc3f7}
.time-buttons{display:flex;gap:6px}
.time-btn{padding:6px 14px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#aaa;cursor:pointer;font-size:13px}
.time-btn.active{background:#4fc3f7;color:#000;border-color:#4fc3f7}
.chart-box{background:#2a2a4a;border-radius:8px;padding:20px;height:550px}
.msg{padding:10px;font-size:13px;white-space:pre-wrap}
.msg-info{color:#888}
.msg-error{color:#ff6b6b}
.progress{background:#333;border-radius:4px;height:20px;margin-top:10px;overflow:hidden}
.progress-bar{background:#4fc3f7;height:100%;transition:width 0.3s;display:flex;align-items:center;justify-content:center;font-size:11px;color:#000}
.nav{display:flex;gap:15px;margin-bottom:10px}
.nav a{color:#4fc3f7;text-decoration:none;font-size:13px}
.filter-tag{padding:4px 10px;border-radius:4px;border:1px solid #555;background:#2a2a4a;color:#e0e0e0;cursor:pointer;font-size:12px}
.filter-tag:hover{border-color:#4fc3f7}
.filter-tag.hidden{opacity:0.4;text-decoration:line-through}
.filter-tag.region-header{background:#333;color:#4fc3f7;font-weight:bold;cursor:default;border-color:#4fc3f7}
table{width:100%;border-collapse:collapse;background:#2a2a4a;border-radius:8px;overflow:hidden;margin-top:15px}
th,td{padding:8px 12px;text-align:center;border-bottom:1px solid #333;font-size:12px}
th{background:#333;color:#aaa;font-weight:500}
td{color:#e0e0e0}
.positive{color:#69f0ae}
.negative{color:#ff6b6b}
</style>
</head>
<body>
<div class="container">
<div class="nav">
  <a href="stocks.html">📈 Stock Tool</a>
  <a href="browse.html">🔍 Browse</a>
  <a href="sectors.html">🏭 Sectors</a>
  <a href="index.html">🏦 Bonds</a>
</div>
<h1>🌍 Global Market Performance</h1>

<div class="section">
  <div class="row">
    <span style="color:#aaa;font-size:12px">View:</span>
    <button class="view-btn active" id="vBtn-regions" onclick="setView('regions')">🌐 By Region</button>
    <button class="view-btn" id="vBtn-all" onclick="setView('all')">📊 All Countries</button>
  </div>
  <div class="time-buttons">
    <button class="time-btn" onclick="setTime('1Y',this)">1Y</button>
    <button class="time-btn" onclick="setTime('3Y',this)">3Y</button>
    <button class="time-btn active" onclick="setTime('5Y',this)">5Y</button>
    <button class="time-btn" onclick="setTime('10Y',this)">10Y</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn btn-primary" onclick="loadAllData()">⬇️ Load All Markets</button>
    <button class="btn btn-secondary" onclick="showAll()">Show All</button>
    <button class="btn btn-secondary" onclick="hideAll()">Hide All</button>
    <span id="status" style="color:#888;font-size:12px"></span>
  </div>
  <div class="progress" id="progressBox" style="display:none">
    <div class="progress-bar" id="progressBar" style="width:0%">0%</div>
  </div>
  <div id="filterTags" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px"></div>
</div>

<div class="chart-box"><canvas id="marketChart"></canvas></div>
<div class="msg msg-error" id="chartMsg"></div>

<div id="returnsTable"></div>

<div class="msg msg-info" style="margin-top:10px">
  Data from Yahoo Finance via proxy. Indices used as proxies for country performance.
  Click country tags to show/hide. Returns are total price return (excl. dividends).
</div>
</div>

<script>
var PROXY='https://yahoo.gretegrents.workers.dev/';
var chart=null,timeRange='5Y',viewMode='regions';
var allData={};
var isLoading=false;
var hiddenCountries={};

var MARKETS={
  "Nordics":{
    "\u{1F1F3}\u{1F1F4} Norway":{ticker:"OSEBX.OL"},
    "\u{1F1F8}\u{1F1EA} Sweden":{ticker:"^OMX"},
    "\u{1F1E9}\u{1F1F0} Denmark":{ticker:"^OMXC25"},
    "\u{1F1EB}\u{1F1EE} Finland":{ticker:"^OMXH25"}
  },
  "Europe":{
    "\u{1F1E9}\u{1F1EA} Germany":{ticker:"^GDAXI"},
    "\u{1F1EC}\u{1F1E7} UK":{ticker:"^FTSE"},
    "\u{1F1EB}\u{1F1F7} France":{ticker:"^FCHI"},
    "\u{1F1F3}\u{1F1F1} Netherlands":{ticker:"^AEX"},
    "\u{1F1E8}\u{1F1ED} Switzerland":{ticker:"^SSMI"},
    "\u{1F1EA}\u{1F1F8} Spain":{ticker:"^IBEX"},
    "\u{1F1EE}\u{1F1F9} Italy":{ticker:"FTSEMIB.MI"},
    "\u{1F1F5}\u{1F1F1} Poland":{ticker:"WIG20.WA"}
  },
  "Americas":{
    "\u{1F1FA}\u{1F1F8} USA (S&P500)":{ticker:"^GSPC"},
    "\u{1F1FA}\u{1F1F8} USA (Nasdaq)":{ticker:"^IXIC"},
    "\u{1F1E8}\u{1F1E6} Canada":{ticker:"^GSPTSE"},
    "\u{1F1E7}\u{1F1F7} Brazil":{ticker:"^BVSP"},
    "\u{1F1F2}\u{1F1FD} Mexico":{ticker:"^MXX"},
    "\u{1F1E6}\u{1F1F7} Argentina":{ticker:"^MERV"}
  },
  "Asia-Pacific":{
    "\u{1F1EF}\u{1F1F5} Japan":{ticker:"^N225"},
    "\u{1F1E8}\u{1F1F3} China":{ticker:"000001.SS"},
    "\u{1F1ED}\u{1F1F0} Hong Kong":{ticker:"^HSI"},
    "\u{1F1F0}\u{1F1F7} South Korea":{ticker:"^KS11"},
    "\u{1F1EE}\u{1F1F3} India":{ticker:"^BSESN"},
    "\u{1F1F9}\u{1F1FC} Taiwan":{ticker:"^TWII"},
    "\u{1F1E6}\u{1F1FA} Australia":{ticker:"^AXJO"},
    "\u{1F1F8}\u{1F1EC} Singapore":{ticker:"^STI"},
    "\u{1F1EE}\u{1F1E9} Indonesia":{ticker:"^JKSE"},
    "\u{1F1F9}\u{1F1ED} Thailand":{ticker:"^SET.BK"}
  },
  "Middle East & Africa":{
    "\u{1F1F9}\u{1F1F7} Turkey":{ticker:"^XU100"},
    "\u{1F1FF}\u{1F1E6} South Africa":{ticker:"^J203.JO"},
    "\u{1F1F8}\u{1F1E6} Saudi Arabia":{ticker:"^TASI.SR"},
    "\u{1F1E6}\u{1F1EA} UAE":{ticker:"^DFMGI"}
  }
};

function getAllCountries(){
  var list=[];
  Object.keys(MARKETS).forEach(function(region){
    Object.keys(MARKETS[region]).forEach(function(country){
      list.push({name:country,ticker:MARKETS[region][country].ticker,region:region});
    });
  });
  return list;
}

async function loadAllData(){
  if(isLoading)return;
  isLoading=true;
  var countries=getAllCountries();
  var total=countries.length;

  document.getElementById('progressBox').style.display='block';
  document.getElementById('status').textContent='Loading '+total+' markets...';
  document.getElementById('chartMsg').textContent='';
  allData={};

  var now=Math.floor(Date.now()/1000);
  var start=new Date();
  start.setFullYear(start.getFullYear()-10);
  var period1=Math.floor(start.getTime()/1000);

  var loaded=0;
  var batchSize=4;
  var failed=[];

  for(var i=0;i<countries.length;i+=batchSize){
    var batch=countries.slice(i,i+batchSize);
    var promises=batch.map(function(c){
      var url=PROXY+'?symbol='+encodeURIComponent(c.ticker)+'&period1='+period1+'&period2='+now+'&interval=1wk';
      return fetch(url).then(function(r){return r.json()}).then(function(data){
        if(data.chart&&data.chart.result&&data.chart.result[0]){
          var result=data.chart.result[0];
          var timestamps=result.timestamp||[];
          var closes=result.indicators.quote[0].close||[];
          allData[c.name]=[];
          for(var j=0;j<timestamps.length;j++){
            if(closes[j]!==null){
              allData[c.name].push({date:new Date(timestamps[j]*1000).toISOString().split('T')[0],close:closes[j]});
            }
          }
          if(allData[c.name].length===0)failed.push(c.name);
        }else{
          failed.push(c.name);
        }
        loaded++;
        var pct=Math.round(loaded/total*100);
        document.getElementById('progressBar').style.width=pct+'%';
        document.getElementById('progressBar').textContent=pct+'% ('+loaded+'/'+total+')';
      }).catch(function(){
        failed.push(c.name);
        loaded++;
      });
    });
    await Promise.all(promises);
    await new Promise(function(r){setTimeout(r,400)});
  }

  var msg='Loaded '+(total-failed.length)+'/'+total+' markets';
  if(failed.length>0)msg+=' | Failed: '+failed.join(', ');
  document.getElementById('status').textContent=msg;
  document.getElementById('progressBox').style.display='none';
  isLoading=false;
  hiddenCountries={};
  renderFilterTags();
  renderChart();
  renderReturnsTable();
}

function setView(mode){
  viewMode=mode;
  document.querySelectorAll('.view-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('vBtn-'+mode).classList.add('active');
  if(Object.keys(allData).length>0){renderChart();renderReturnsTable();}
}

function setTime(r,btn){
  timeRange=r;
  document.querySelectorAll('.time-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  if(Object.keys(allData).length>0){renderChart();renderReturnsTable();}
}

function getStartDate(){
  var d=new Date();
  if(timeRange==='1Y')d.setFullYear(d.getFullYear()-1);
  else if(timeRange==='3Y')d.setFullYear(d.getFullYear()-3);
  else if(timeRange==='5Y')d.setFullYear(d.getFullYear()-5);
  else if(timeRange==='10Y')d.setFullYear(d.getFullYear()-10);
  return d.toISOString().split('T')[0];
}

function renderFilterTags(){
  var html='';
  Object.keys(MARKETS).forEach(function(region){
    html+='<span class="filter-tag region-header">'+region+'</span>';
    Object.keys(MARKETS[region]).forEach(function(country){
      var cls=hiddenCountries[country]?'filter-tag hidden':'filter-tag';
      html+='<button class="'+cls+'" onclick="toggleCountry(this.dataset.country)" data-country="'+country+'">'+country+'</button>';
    });
  });
  document.getElementById('filterTags').innerHTML=html;
}

function toggleCountry(country){
  if(hiddenCountries[country])delete hiddenCountries[country];
  else hiddenCountries[country]=true;
  renderFilterTags();
  if(Object.keys(allData).length>0){renderChart();renderReturnsTable();}
}

function showAll(){
  hiddenCountries={};
  renderFilterTags();
  if(Object.keys(allData).length>0){renderChart();renderReturnsTable();}
}

function hideAll(){
  getAllCountries().forEach(function(c){hiddenCountries[c.name]=true});
  renderFilterTags();
  if(chart){chart.destroy();chart=null;}
  document.getElementById('chartMsg').textContent='All countries hidden. Click tags to show.';
  document.getElementById('returnsTable').innerHTML='';
}

function renderChart(){
  var startDate=getStartDate();
  var colors=['#4fc3f7','#ff6b6b','#69f0ae','#ffd54f','#ce93d8','#ff8a65','#80cbc4','#f48fb1','#aed581','#90a4ae',
    '#fff176','#a1887f','#b39ddb','#ef9a9a','#80deea','#ffcc80','#c5e1a5','#f8bbd0','#b0bec5','#dce775',
    '#84ffff','#ff80ab','#ccff90','#ffd180','#a7ffeb','#ff9e80','#b388ff','#82b1ff','#69f0ae','#ffff8d'];

  var datasets=[],labels=null;
  var idx=0;

  if(viewMode==='regions'){
    Object.keys(MARKETS).forEach(function(region){
      var regionData=[];
      Object.keys(MARKETS[region]).forEach(function(country){
        if(hiddenCountries[country])return;
        if(!allData[country]||!allData[country].length)return;
        var filtered=allData[country].filter(function(d){return d.date>=startDate});
        if(filtered.length<2)return;
        var base=filtered[0].close;
        regionData.push(filtered.map(function(d){return{date:d.date,val:d.close/base}}));
      });
      if(!regionData.length)return;

      var maxLen=0;
      regionData.forEach(function(s){if(s.length>maxLen)maxLen=s.length});
      if(!labels)labels=regionData.reduce(function(a,b){return a.length>b.length?a:b}).map(function(d){return d.date});

      var avgData=[];
      for(var i=0;i<maxLen;i++){
        var sum=0,count=0;
        regionData.forEach(function(s){if(i<s.length){sum+=s[i].val;count++;}});
        avgData.push(count>0?sum/count:null);
      }

      datasets.push({
        label:region+' ('+regionData.length+')',
        data:avgData,
        borderColor:colors[idx%colors.length],
        backgroundColor:'transparent',
        borderWidth:3,
        pointRadius:0,
        tension:0.2
      });
      idx++;
    });
  }else{
    var countries=getAllCountries();
    countries.forEach(function(c){
      if(hiddenCountries[c.name])return;
      if(!allData[c.name]||!allData[c.name].length)return;
      var filtered=allData[c.name].filter(function(d){return d.date>=startDate});
      if(filtered.length<2)return;
      var base=filtered[0].close;
      if(!labels)labels=filtered.map(function(d){return d.date});
      datasets.push({
        label:c.name,
        data:filtered.map(function(d){return d.close/base}),
        borderColor:colors[idx%colors.length],
        backgroundColor:'transparent',
        borderWidth:2,
        pointRadius:0,
        tension:0.2
      });
      idx++;
    });
  }

  if(!labels||!datasets.length){
    if(chart){chart.destroy();chart=null;}
    document.getElementById('chartMsg').textContent='No data to display.';
    return;
  }
  document.getElementById('chartMsg').textContent='';

  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('marketChart'),{
    type:'line',
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'right',labels:{color:'#e0e0e0',usePointStyle:true,font:{size:11}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+(ctx.parsed.y*100).toFixed(1)+'%'}}}
      },
      scales:{
        x:{ticks:{color:'#888',maxTicksLimit:12},grid:{color:'#333'}},
        y:{ticks:{color:'#888',callback:function(v){return(v*100).toFixed(0)+'%'}},grid:{color:'#333'}}
      }
    }
  });
}

function renderReturnsTable(){
  var startDate=getStartDate();
  var rows=[];

  getAllCountries().forEach(function(c){
    if(hiddenCountries[c.name])return;
    if(!allData[c.name]||!allData[c.name].length)return;
    var filtered=allData[c.name].filter(function(d){return d.date>=startDate});
    if(filtered.length<2)return;
    var startPrice=filtered[0].close;
    var endPrice=filtered[filtered.length-1].close;
    var totalReturn=((endPrice/startPrice)-1)*100;
    var years=parseFloat(timeRange.replace('Y',''));
    var annualized=(Math.pow(endPrice/startPrice,1/years)-1)*100;
    rows.push({country:c.name,region:c.region,totalReturn:totalReturn,annualized:annualized});
  });

  rows.sort(function(a,b){return b.totalReturn-a.totalReturn});

  var html='<table><tr><th>#</th><th style="text-align:left">Country</th><th>Region</th><th>Total Return</th><th>Annualized</th></tr>';
  rows.forEach(function(r,i){
    var trCls=r.totalReturn>=0?'positive':'negative';
    var anCls=r.annualized>=0?'positive':'negative';
    html+='<tr><td>'+(i+1)+'</td><td style="text-align:left">'+r.country+'</td><td>'+r.region+'</td>';
    html+='<td class="'+trCls+'">'+r.totalReturn.toFixed(1)+'%</td>';
    html+='<td class="'+anCls+'">'+r.annualized.toFixed(1)+'%</td></tr>';
  });
  html+='</table>';
  document.getElementById('returnsTable').innerHTML=html;
}
</script>
</body>
</html>
