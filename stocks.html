<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Comparison Tool</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
.container{max-width:1400px;margin:0 auto}
h1{text-align:center;margin-bottom:20px;color:#fff}
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{padding:10px 24px;background:#2a2a4a;border:none;color:#aaa;cursor:pointer;border-radius:8px 8px 0 0;font-size:14px}
.tab.active{color:#fff;border-bottom:2px solid #4fc3f7}
.tab-content{display:none}
.tab-content.active{display:block}
.section{background:#2a2a4a;padding:15px;border-radius:8px;margin-bottom:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=text]{padding:8px 12px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#fff;width:250px}
.btn{padding:8px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px}
.btn-primary{background:#4fc3f7;color:#000}
.btn-primary:hover{background:#81d4fa}
.btn-secondary{background:#444;color:#fff}
.btn-secondary:hover{background:#555}
.btn-small{padding:4px 10px;font-size:12px}
.time-buttons{display:flex;gap:6px}
.time-btn{padding:6px 14px;border-radius:4px;border:1px solid #444;background:#1a1a2e;color:#aaa;cursor:pointer;font-size:13px}
.time-btn.active{background:#4fc3f7;color:#000;border-color:#4fc3f7}
.chart-box{background:#2a2a4a;border-radius:8px;padding:20px;height:500px}
.msg{padding:10px;font-size:13px;white-space:pre-wrap}
.msg-error{color:#ff6b6b}
.msg-info{color:#888}
table{width:100%;border-collapse:collapse;background:#2a2a4a;border-radius:8px;overflow:hidden;margin-top:10px}
th,td{padding:10px 14px;text-align:center;border-bottom:1px solid #333;font-size:13px}
th{background:#333;color:#aaa}
.peg-green{background:#1b5e20;color:#69f0ae}
.peg-yellow{background:#33691e;color:#aed581}
.peg-red{background:#b71c1c;color:#ff8a80}
textarea.notes{width:100%;height:50px;background:#1a1a2e;border:1px solid #444;color:#e0e0e0;border-radius:4px;padding:6px;font-size:12px;resize:vertical}
.export-btns{margin-top:15px;display:flex;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:flex;align-items:center;gap:4px;background:#3a3a5a;border:1px solid #555;border-radius:16px;padding:4px 10px;font-size:12px;color:#e0e0e0}
.tag .x{cursor:pointer;color:#ff6b6b;font-weight:bold;margin-left:4px;font-size:14px}
.tag .x:hover{color:#ff0000}
.fin-card{background:#2a2a4a;border-radius:8px;padding:15px;margin-bottom:15px}
.fin-card h3{color:#4fc3f7;margin-bottom:10px;font-size:14px}
.fin-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #333;font-size:13px}
.fin-row span:first-child{color:#aaa}
.fin-row span:last-child{color:#fff}
</style>
</head>
<body>
<div class="container">
<h1>Stock Comparison Tool</h1>

<div class="section">
  <span style="color:#888;font-size:12px">Powered by Twelve Data (800 calls/day)</span>
</div>

<div class="tabs">
  <button class="tab active" id="tabBtn-chart" onclick="switchTab('chart')">📈 Chart</button>
  <button class="tab" id="tabBtn-valuation" onclick="switchTab('valuation')">📊 Valuation</button>
  <button class="tab" id="tabBtn-financials" onclick="switchTab('financials')">🏦 Financials</button>
</div>

<div id="tab-chart" class="tab-content active">
  <div class="section">
    <div class="row">
      <input type="text" id="chartInput" placeholder="Type ticker and press Enter" onkeydown="if(event.key==='Enter')addTag()">
      <button class="btn btn-small btn-primary" onclick="addTag()">Add</button>
      <button class="btn btn-primary" onclick="fetchChart()">Load Chart</button>
    </div>
    <div class="tags" id="chartTags"></div>
    <div class="time-buttons" style="margin-top:10px">
      <button class="time-btn" onclick="setTime('1M',this)">1M</button>
      <button class="time-btn" onclick="setTime('3M',this)">3M</button>
      <button class="time-btn active" onclick="setTime('6M',this)">6M</button>
      <button class="time-btn" onclick="setTime('1Y',this)">1Y</button>
      <button class="time-btn" onclick="setTime('3Y',this)">3Y</button>
      <button class="time-btn" onclick="setTime('5Y',this)">5Y</button>
    </div>
  </div>
  <div class="chart-box"><canvas id="priceChart"></canvas></div>
  <div class="msg msg-error" id="chartMsg"></div>
  <div class="msg msg-info">Prices normalized to 100% at start date for comparison.</div>
</div>

<div id="tab-valuation" class="tab-content">
  <div class="section">
    <div class="row">
      <input type="text" id="valTickers" placeholder="Tickers separated by commas (e.g. AAPL, MSFT)">
      <button class="btn btn-primary" onclick="fetchVal()">Fetch Data</button>
    </div>
  </div>
  <div id="valTable"></div>
  <div class="export-btns">
    <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-secondary" onclick="exportPDF()">Export PDF</button>
  </div>
</div>

<div id="tab-financials" class="tab-content">
  <div class="section">
    <div class="row">
      <input type="text" id="finTicker" placeholder="Single ticker (e.g. AAPL)">
      <button class="btn btn-primary" onclick="fetchFinancials()">Load Financials</button>
    </div>
  </div>
  <div id="finData"><div class="msg msg-info">Balance sheet requires Twelve Data Pro plan. Showing available metrics from statistics endpoint instead.</div></div>
</div>
</div>

<script>
var API_KEY='a9dbe0a930ff4e08a0856285c50ec908';
var chart=null,timeRange='6M',chartData={},chartNames={};
var tickers=[];

function switchTab(t){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active')});
  document.querySelectorAll('.tab').forEach(function(el){el.classList.remove('active')});
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('tabBtn-'+t).classList.add('active');
}

// --- Tags ---
function addTag(){
  var input=document.getElementById('chartInput');
  var val=input.value.trim().toUpperCase();
  if(val&&tickers.indexOf(val)===-1){
    tickers.push(val);
    renderTags();
  }
  input.value='';
  input.focus();
}

function removeTag(ticker){
  tickers=tickers.filter(function(t){return t!==ticker});
  renderTags();
  if(chartData[ticker]){
    delete chartData[ticker];
    delete chartNames[ticker];
    if(Object.keys(chartData).length>0)renderChart();
    else if(chart){chart.destroy();chart=null;}
  }
}

function renderTags(){
  var html='';
  tickers.forEach(function(t){
    var name=chartNames[t]?(' — '+chartNames[t]):'';
    html+='<div class="tag">'+t+name+'<span class="x" onclick="removeTag(\''+t+'\')">×</span></div>';
  });
  document.getElementById('chartTags').innerHTML=html;
}

// --- Time ---
function setTime(r,btn){
  timeRange=r;
  document.querySelectorAll('.time-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  if(Object.keys(chartData).length>0)renderChart();
}

function getStart(){
  var d=new Date();
  if(timeRange==='1M')d.setMonth(d.getMonth()-1);
  else if(timeRange==='3M')d.setMonth(d.getMonth()-3);
  else if(timeRange==='6M')d.setMonth(d.getMonth()-6);
  else if(timeRange==='1Y')d.setFullYear(d.getFullYear()-1);
  else if(timeRange==='3Y')d.setFullYear(d.getFullYear()-3);
  else if(timeRange==='5Y')d.setFullYear(d.getFullYear()-5);
  return d.toISOString().split('T')[0];
}


// --- Chart ---
function fetchChart(){
  if(!tickers.length){document.getElementById('chartMsg').textContent='Add at least one ticker';return}
  document.getElementById('chartMsg').textContent='Loading...';
  chartData={};
  chartNames={};
  var loaded=0;
  
  var now=Math.floor(Date.now()/1000);
  var start=new Date();
  if(timeRange==='1M')start.setMonth(start.getMonth()-1);
  else if(timeRange==='3M')start.setMonth(start.getMonth()-3);
  else if(timeRange==='6M')start.setMonth(start.getMonth()-6);
  else if(timeRange==='1Y')start.setFullYear(start.getFullYear()-1);
  else if(timeRange==='3Y')start.setFullYear(start.getFullYear()-3);
  else if(timeRange==='5Y')start.setFullYear(start.getFullYear()-5);
  var period1=Math.floor(start.getTime()/1000);
  
  tickers.forEach(function(ticker){
     var url='https://yahoo.gretegrents.workers.dev/?symbol='+ticker+'&period1='+period1+'&period2='+now+'&interval=1d';
    fetch(url).then(function(r){return r.json()}).then(function(data){
      if(data.chart&&data.chart.result&&data.chart.result[0]){
        var result=data.chart.result[0];
        var timestamps=result.timestamp;
        var closes=result.indicators.quote[0].close;
        var name=result.meta.shortName||result.meta.symbol;
        chartNames[ticker]=name;
        chartData[ticker]=[];
        for(var i=0;i<timestamps.length;i++){
          if(closes[i]!==null){
            var d=new Date(timestamps[i]*1000);
            var dateStr=d.toISOString().split('T')[0];
            chartData[ticker].push({date:dateStr,close:closes[i]});
          }
        }
      }else{
        document.getElementById('chartMsg').textContent+='\n'+ticker+': No data found';
      }
      loaded++;
      if(loaded===tickers.length){
        renderTags();
        if(Object.keys(chartData).length>0){
          document.getElementById('chartMsg').textContent='';
          renderChart();
        }else{
          document.getElementById('chartMsg').textContent+='\nNo data to display';
        }
      }
    }).catch(function(e){
      document.getElementById('chartMsg').textContent+='\n'+ticker+': '+e.message;
      loaded++;
    });
  });
}

function renderChart(){
  var colors=['#4fc3f7','#ff6b6b','#69f0ae','#ffd54f','#ce93d8','#ff8a65','#80cbc4','#f48fb1','#aed581','#90a4ae'];
  var datasets=[],labels=null;
  
  Object.keys(chartData).forEach(function(ticker,idx){
    var data=chartData[ticker];
    if(!data.length)return;
    var base=data[0].close;
    if(!labels)labels=data.map(function(d){return d.date});
    var legendLabel=chartNames[ticker]?ticker+' — '+chartNames[ticker]:ticker;
    datasets.push({
      label:legendLabel,
      data:data.map(function(d){return d.close/base}),
      borderColor:colors[idx%colors.length],
      backgroundColor:'transparent',
      borderWidth:2,
      pointRadius:0,
      tension:0.1
    });
  });
  
  if(!labels)return;
  if(chart)chart.destroy();
  
  chart=new Chart(document.getElementById('priceChart'),{
    type:'line',
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'right',labels:{color:'#e0e0e0',usePointStyle:true,font:{size:11}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+(ctx.parsed.y*100).toFixed(1)+'%'}}}
      },
      scales:{
        x:{ticks:{color:'#888',maxTicksLimit:12},grid:{color:'#333'}},
        y:{ticks:{color:'#888',callback:function(v){return(v*100).toFixed(0)+'%'}},grid:{color:'#333'}}
      }
    }
  });
}

// --- Valuation ---
function fetchVal(){
  var tks=document.getElementById('valTickers').value.split(',').map(function(t){return t.trim().toUpperCase()}).filter(function(t){return t});
  if(!tks.length){alert('Enter tickers');return}
  var results={},loaded=0;
  
  tks.forEach(function(ticker){
    fetch('https://api.twelvedata.com/statistics?symbol='+ticker+'&apikey='+API_KEY)
    .then(function(r){return r.json()}).then(function(d){
      if(d.statistics){
        var s=d.statistics;
        var v=s.valuations_metrics||{};
        var f=s.financials||{};
        results[ticker]={
          name:d.meta?d.meta.name:ticker,
          marketCap:v.market_capitalization?fmt(parseFloat(v.market_capitalization)):'-',
          eps:f.earnings_per_share||'-',
          pe:v.trailing_pe||'-',
          forwardPE:v.forward_pe||'-',
          peg:v.peg_ratio||'-',
          divYield:s.dividends_and_splits&&s.dividends_and_splits.dividend_yield?s.dividends_and_splits.dividend_yield+'%':'-',
          beta:s.stock_price_summary?s.stock_price_summary.beta:'-',
          high52:s.stock_price_summary?s.stock_price_summary['52_week_high']:'-',
          low52:s.stock_price_summary?s.stock_price_summary['52_week_low']:'-'
        };
      }else{
        results[ticker]={name:ticker,error:d.message||'No data'};
      }
      loaded++;
      if(loaded===tks.length)renderVal(tks,results);
    }).catch(function(e){
      results[ticker]={name:ticker,error:e.message};
      loaded++;
      if(loaded===tks.length)renderVal(tks,results);
    });
  });
}

function fmt(n){
  if(n>=1e12)return(n/1e12).toFixed(1)+'T';
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  return n.toFixed(0);
}

function renderVal(tks,results){
  var rows=[
    {k:'name',l:'Company'},{k:'marketCap',l:'Market Cap'},{k:'eps',l:'EPS'},
    {k:'pe',l:'Trailing P/E'},{k:'forwardPE',l:'Forward P/E'},
    {k:'peg',l:'PEG Ratio',hl:true},{k:'divYield',l:'Div Yield'},
    {k:'beta',l:'Beta'},{k:'high52',l:'52W High'},{k:'low52',l:'52W Low'},{k:'notes',l:'Notes'}
  ];
  var h='<table><tr><th>Metric</th>';
  tks.forEach(function(t){h+='<th>'+t+'</th>'});
  h+='</tr>';
  rows.forEach(function(r){
    h+='<tr><td style="text-align:left">'+r.l+'</td>';
    tks.forEach(function(t){
      var d=results[t]||{};
      if(r.k==='notes'){h+='<td><textarea class="notes" placeholder="Notes..."></textarea></td>'}
      else{
        var val=d[r.k]||'-';
        var cls='';
        if(r.hl&&val!=='-'){var p=parseFloat(val);if(p<1)cls='peg-green';else if(p<2)cls='peg-yellow';else if(p>3)cls='peg-red';}
        h+='<td class="'+cls+'">'+val+'</td>';
      }
    });
    h+='</tr>';
  });
  h+='</table>';
  document.getElementById('valTable').innerHTML=h;
}

// --- Financials ---
function fetchFinancials(){
  var ticker=document.getElementById('finTicker').value.trim().toUpperCase();
  if(!ticker){alert('Enter a ticker');return}
  document.getElementById('finData').innerHTML='<div class="msg msg-info">Loading...</div>';
  
  fetch('https://api.twelvedata.com/statistics?symbol='+ticker+'&apikey='+API_KEY)
  .then(function(r){return r.json()}).then(function(d){
    if(!d.statistics){
      document.getElementById('finData').innerHTML='<div class="msg msg-error">'+(d.message||'No data')+'</div>';
      return;
    }
    var s=d.statistics;
    var v=s.valuations_metrics||{};
    var f=s.financials||{};
    var sp=s.stock_price_summary||{};
    var name=d.meta?d.meta.name:ticker;
    
    var h='<div class="fin-card"><h3>'+ticker+' — '+name+'</h3>';
    h+='<table><tr><th style="text-align:left">Metric</th><th>Value</th></tr>';
    var items=[
      ['Market Cap',v.market_capitalization?fmt(parseFloat(v.market_capitalization)):'-'],
      ['Enterprise Value',v.enterprise_value?fmt(parseFloat(v.enterprise_value)):'-'],
      ['Trailing P/E',v.trailing_pe||'-'],
      ['Forward P/E',v.forward_pe||'-'],
      ['PEG Ratio',v.peg_ratio||'-'],
      ['Price/Book',v.price_to_book_ratio||'-'],
      ['EPS',f.earnings_per_share||'-'],
      ['Revenue/Share',f.revenue_per_share||'-'],
      ['Profit Margin',f.profit_margin||'-'],
      ['Operating Margin',f.operating_margin||'-'],
      ['ROE',f.return_on_equity||'-'],
      ['ROA',f.return_on_assets||'-'],
      ['Revenue',f.revenue?fmt(parseFloat(f.revenue)):'-'],
      ['Net Income',f.net_income?fmt(parseFloat(f.net_income)):'-'],
      ['Total Debt',f.total_debt?fmt(parseFloat(f.total_debt)):'-'],
      ['Debt/Equity',f.debt_to_equity||'-'],
      ['Current Ratio',f.current_ratio||'-'],
      ['Book Value/Share',f.book_value_per_share||'-'],
      ['Beta',sp.beta||'-'],
      ['52W High',sp['52_week_high']||'-'],
      ['52W Low',sp['52_week_low']||'-']
    ];
    items.forEach(function(item){
      h+='<tr><td style="text-align:left">'+item[0]+'</td><td>'+item[1]+'</td></tr>';
    });
    h+='</table></div>';
    document.getElementById('finData').innerHTML=h;
  }).catch(function(e){
    document.getElementById('finData').innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  });
}

// --- Export ---
function exportCSV(){
  var t=document.querySelector('#valTable table');
  if(!t){alert('No data');return}
  var csv='';
  t.querySelectorAll('tr').forEach(function(row){
    var cells=[];
    row.querySelectorAll('th,td').forEach(function(c){cells.push('"'+(c.textContent||'').replace(/"/g,'""')+'"')});
    csv+=cells.join(',')+'\n';
  });
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='stocks.csv';a.click();
}

function exportPDF(){
  var c=document.getElementById('valTable').innerHTML;
  var w=window.open('');
  w.document.write('<html><head><title>Stocks</title><style>table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:12px}th{background:#f0f0f0}</style></head><body>'+c+'</body></html>');
  w.document.close();w.print();
}
</script>
</body>
</html>
